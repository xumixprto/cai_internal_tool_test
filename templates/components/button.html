{% if url %}
  <a href="{{ url }}" class="btn btn-{{ style|default:'primary' }}{% if size %} btn-{{ size }}{% endif %}">
    {{ label }}
  </a>
{% else %}
  <button type="{{ type|default:'button' }}" class="btn btn-{{ style|default:'primary' }}{% if size %} btn-{{ size }}{% endif %}">
    {{ label }}
  </button>
{% endif %}
