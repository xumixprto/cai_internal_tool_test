<div class="mb-3">
  <label for="{{ id|default:name }}" class="form-label">{{ label }}{% if required %} <span class="text-danger">*</span>{% endif %}</label>
  <textarea name="{{ name }}" id="{{ id|default:name }}" rows="{{ rows|default:4 }}" class="form-control{% if error %} is-invalid{% endif %}"{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if required %} required{% endif %}{% if disabled %} disabled{% endif %}>{{ value|default:'' }}</textarea>
  {% if help %}<div class="form-text">{{ help }}</div>{% endif %}
  {% if error %}<div class="invalid-feedback d-block">{{ error }}</div>{% endif %}
</div>
